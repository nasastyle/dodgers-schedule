name: TV放送データ自動更新

on:
  schedule:
    - cron: "0 */6 * * *" # 6時間ごと (UTC)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: J SPORTS番組表を取得
        run: python scripts/fetch_jsports.py

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jsports.json
          git diff --cached --quiet || (git commit -m "TV放送データ自動更新" && git push)
